<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
  <title>Lakebase Workbench</title>
  <style>
    :root{color-scheme:dark;--bg:#111613;--panel:#191f1b;--raised:#202822;--hover:#28342c;--line:#303a33;--text:#e4ece6;--muted:#99a69d;--quiet:#68756c;--green:#a8d58d;--mint:#66d2ae;--red:#ee8878;--code:#111714;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:"Avenir Next","Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 75% 0%,rgba(86,129,97,.13),transparent 38%),var(--bg);color:var(--text);font:13px/1.45 var(--sans)}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-rows:48px 33px minmax(0,1fr)}
    .top{display:flex;align-items:center;gap:11px;padding:0 15px;border-bottom:1px solid var(--line);background:rgba(17,22,19,.94)}.mark{display:grid;place-items:center;width:25px;height:25px;border:1px solid #587263;border-radius:6px;color:var(--green);font-weight:700}.brand{font-size:13px;font-weight:650}.divider{height:18px;border-left:1px solid var(--line)}.host{min-width:0;overflow:hidden;color:var(--muted);font:10px var(--mono);text-overflow:ellipsis;white-space:nowrap}.dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--mint);box-shadow:0 0 9px #66d2ae55}.spacer{flex:1}.user{max-width:230px;overflow:hidden;padding:5px 9px;border:1px solid var(--line);border-radius:5px;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.crumb{display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #252d28;color:var(--quiet);font:10px var(--mono)}.crumb b{color:var(--muted);font-weight:500}
    .layout{min-height:0;display:grid;grid-template-columns:285px minmax(0,1fr)}.explorer{display:flex;min-height:0;flex-direction:column;border-right:1px solid var(--line);background:rgba(21,26,23,.94)}.explorer-head{padding:13px 12px 10px;border-bottom:1px solid #28312b}.heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.icon{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted)}.icon:hover{border-color:var(--line);background:var(--hover);color:var(--text)}.icon svg,.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.db{width:100%;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:5px;outline:0;background:var(--panel);font:11px var(--mono)}.db:focus,.search:focus{border-color:#718e78}.search-wrap{padding:8px 10px 5px}.search{width:100%;height:29px;padding:0 8px;border:1px solid #2c3530;border-radius:4px;outline:0;background:#151b18;color:var(--text);font-size:11px}.tree{min-height:0;overflow:auto;padding:3px 8px 14px}.schema{margin:2px 0}.row{display:flex;min-height:27px;align-items:center;gap:6px;width:100%;padding:3px 6px;overflow:hidden;border:0;border-radius:4px;background:transparent;color:#bbc8bf;text-align:left}.row:hover{background:var(--hover)}.row.active{background:#2b3b32;color:#e4f1e8}.row.schema-name{color:#d0dbd3;font-weight:600}.row.object{padding-left:20px;color:#adb9b0;font:11px var(--mono)}.chev{width:12px;color:var(--quiet);font-size:10px}.glyph{width:14px;flex:none;color:#94c59b;text-align:center}.row[data-kind*=function] .glyph,.row[data-kind=procedure] .glyph,.row[data-kind=aggregate] .glyph{color:#c3a5d9}.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group{margin-left:17px}.group-title{padding:5px 5px 2px;color:var(--quiet);font-size:9px;letter-spacing:.06em;text-transform:uppercase}.empty{padding:12px 7px;color:var(--quiet);font-size:11px}.foot{display:flex;align-items:center;gap:6px;min-height:34px;margin-top:auto;padding:0 12px;border-top:1px solid #28312b;color:var(--quiet);font-size:10px}.foot input{margin-left:auto;accent-color:var(--mint)}
    .main{min-width:0;min-height:0;display:grid;grid-template-rows:45px minmax(210px,1fr) 205px}.toolbar{display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line);background:#191f1bcc}.title{display:flex;min-width:0;align-items:center;gap:8px;margin-right:auto;font-size:12px}.sql-tag{color:var(--green);font:10px var(--mono)}#active-title{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dirty{color:#e6bd77}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:29px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:var(--raised);color:#c9d4cc;font-size:11px}.btn:hover{border-color:#53675a;background:#28342c}.btn.primary{border-color:#52735c;background:#2b4938;color:#d8f0df}.btn.primary:hover{background:#345b44}.btn:disabled{cursor:wait;opacity:.55}.edit{min-height:0;display:grid;grid-template-columns:42px minmax(0,1fr);overflow:hidden;background:var(--code)}.gutter{margin:0;padding:16px 9px 20px 0;overflow:hidden;color:#536158;font:12px/1.7 var(--mono);text-align:right;user-select:none}.editor{width:100%;height:100%;min-height:0;resize:none;padding:16px 18px 24px 7px;border:0;outline:0;background:transparent;color:#d8e3da;caret-color:var(--green);font:12px/1.7 var(--mono);tab-size:2;white-space:pre;overflow:auto}.editor::placeholder{color:#65736a}
    .results{min-height:0;display:grid;grid-template-rows:37px minmax(0,1fr);border-top:1px solid var(--line);background:#151a17}.result-tabs{display:flex;align-items:center;gap:12px;padding:0 13px;border-bottom:1px solid #28312b}.result-tab{height:100%;padding:0 3px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--quiet);font-size:11px}.result-tab.active{border-bottom-color:var(--mint);color:#d3e0d6}.meta{margin-left:auto;color:var(--quiet);font:10px var(--mono)}.result-content{min-height:0;overflow:auto}.message{padding:12px 14px;color:var(--muted);font-size:11px}.message.error{color:var(--red);white-space:pre-wrap}.message.success{color:var(--mint)}.table{width:100%;border-collapse:collapse;font:11px var(--mono);white-space:nowrap}.table th,.table td{max-width:380px;padding:7px 10px;overflow:hidden;border-bottom:1px solid #28312b;text-align:left;text-overflow:ellipsis}.table th{position:sticky;top:0;background:#1b221e;color:#aab9ae;font-weight:500}.table td{color:#c7d2ca}.table td.null{color:var(--quiet);font-style:italic}.mobile-menu{display:none}
    @media(max-width:760px){body{height:100dvh}.top{padding:0 9px}.host{max-width:32vw}.user{max-width:115px}.layout{grid-template-columns:1fr}.explorer{position:absolute;z-index:4;top:81px;bottom:0;left:0;width:min(310px,88vw);box-shadow:14px 0 30px #0006;transform:translateX(-105%);transition:transform .18s ease}.explorer.open{transform:translateX(0)}.mobile-menu{display:inline-grid}.main{grid-template-rows:44px minmax(175px,1fr) minmax(145px,27vh)}.toolbar{gap:5px;padding:0 7px}.btn{min-height:28px;padding:0 7px}.btn .label{display:none}#active-title{max-width:34vw}.editor{padding-right:9px}.crumb{padding-left:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
  <style>
    .layout { grid-template-columns: var(--explorer-width, 285px) 10px minmax(0, 1fr); }
    .editor[readonly] { color: #7e8c82; caret-color: transparent; cursor: default; }
    .editor-code.readonly .sql-highlight { filter: saturate(.45) brightness(.72); }
    .main { grid-template-rows: 45px minmax(120px, 1fr) 12px minmax(145px, var(--results-height, 205px)); }
    .resize-handle { position: relative; z-index: 1; display: grid; place-items: center; min-height: 12px; background: #171d19; cursor: row-resize; touch-action: none; user-select: none; }
    .resize-handle::after { content: ""; width: 42px; height: 3px; border-block: 1px solid #68766c; }
    .resize-handle:hover::after, .resize-handle:focus-visible::after { border-color: var(--mint); }
    .resize-handle:focus-visible { outline: 1px solid var(--mint); outline-offset: -1px; }
    body.resizing { cursor: row-resize; user-select: none; }
    body.resizing-columns { cursor: col-resize; user-select: none; }
    .sidebar-resize { position: relative; z-index: 2; display: grid; place-items: center; cursor: col-resize; touch-action: none; user-select: none; }
    .sidebar-resize::after { content: ""; width: 2px; height: 38px; background: #46534a; }
    .sidebar-resize:hover::after, .sidebar-resize:focus-visible::after { background: var(--mint); }
    .sidebar-resize:focus-visible { outline: 1px solid var(--mint); outline-offset: -1px; }
    .editor-code { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--code); }
    .sql-highlight, .editor { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 16px 18px 24px 7px; border: 0; font: 12px/1.7 var(--mono); tab-size: 2; white-space: pre; overflow: auto; }
    .sql-highlight { pointer-events: none; color: #d8e3da; }
    .editor { z-index: 1; resize: none; outline: 0; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--green); }
    .editor::selection { background: #739a7955; color: transparent; }
    .editor:placeholder-shown { -webkit-text-fill-color: #65736a; }
    .sql-keyword { color: #e5bd79; }.sql-type { color: #8fc8d5; }.sql-function { color: #87c9a7; }
    .sql-string { color: #b5d69a; }.sql-number { color: #d6a7d0; }.sql-comment { color: #78867a; font-style: italic; }.sql-identifier { color: #a8c4df; }
    .object-menu { position: fixed; z-index: 20; min-width: 190px; padding: 4px; border: 1px solid var(--line); border-radius: 5px; background: #202722; box-shadow: 0 8px 24px #0008; }
    .object-menu[hidden], .btn[hidden] { display: none !important; }
    .object-menu button { display: block; width: 100%; padding: 7px 9px; border: 0; border-radius: 3px; background: transparent; color: var(--text); text-align: left; font-size: 11px; }
    .object-menu button[hidden] { display: none; }
    .object-menu button:hover, .object-menu button:focus-visible { outline: 0; background: var(--hover); }
    .title { min-width: 0; flex: 1; gap: 10px; margin-right: 0; }
    .editor-tabs { display: flex; min-width: 0; flex: 1; align-items: center; gap: 3px; overflow-x: auto; }
    .editor-tab { display: inline-flex; min-width: 0; max-width: 210px; align-items: center; border: 1px solid transparent; border-radius: 4px; background: transparent; }
    .editor-tab.active { border-color: #3a493e; background: #222b25; }
    .editor-tab-title { min-width: 0; overflow: hidden; padding: 4px 7px; border: 0; background: transparent; color: var(--muted); font: 10px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .editor-tab.active .editor-tab-title { color: var(--text); }
    .editor-tab-close { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--quiet); }
    .editor-tab-close:hover { background: var(--hover); color: var(--text); }
    .editor-tab-dirty { color: var(--amber); }
    #active-title, #dirty { display: none; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .sidebar-resize { display: none; } .main { grid-template-rows: 44px minmax(120px, 1fr) 12px minmax(145px, var(--results-height, 27vh)); } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <button class="icon mobile-menu" id="mobile-menu" aria-label="Open object explorer" title="Open object explorer"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="mark">L</div><div class="brand">Lakebase Workbench</div><div class="divider"></div><span class="dot"></span><div class="host" id="host">Connecting</div><div class="spacer"></div><div class="user" id="user">Checking user authorization</div>
    </header>
    <div class="crumb"><span>LAKEBASE</span><span>/</span><b id="breadcrumb">DATABASE EXPLORER</b></div>
    <div class="layout">
      <aside class="explorer" id="explorer">
        <div class="explorer-head"><div class="heading"><span>Object Explorer</span><button class="icon" id="refresh" title="Refresh objects" aria-label="Refresh objects"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5A7 7 0 0 0 18.4 15"/></svg></button></div><select class="db" id="database" aria-label="Database"><option>Loading databases...</option></select></div>
        <div class="search-wrap"><input class="search" id="filter" type="search" placeholder="Filter objects" aria-label="Filter objects"></div>
        <div class="tree" id="tree"><div class="empty">Loading database catalog...</div></div>
        <div class="foot"><span id="count">0 objects</span><label for="system">System</label><input id="system" type="checkbox" title="Show system schemas"></div>
      </aside>
      <div class="sidebar-resize" id="sidebar-resize" role="separator" aria-label="Resize object explorer" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="480" aria-valuenow="285" tabindex="0" title="Drag to resize explorer"></div>
      <main class="main">
        <div class="toolbar"><div class="title"><span class="sql-tag">SQL</span><div class="editor-tabs" id="editor-tabs" role="tablist" aria-label="SQL editors"></div><span id="active-title">query.sql</span><span class="dirty" id="dirty" hidden>●</span></div>
          <button class="btn" id="new" title="New query"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="label">New</span></button>
          <button class="btn" id="copy" title="Copy object definition"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span class="label">Copy DDL</span></button>
          <button class="btn" id="edit-mode" title="Edit selected object definition" aria-label="Edit selected object definition" hidden><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="m16.5 3.5 4 4L8 20l-5 1 1-5z"/></svg><span class="label">Edit</span></button>
          <button class="btn primary" id="run" title="Run SQL (Ctrl or Cmd + Enter)"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg><span class="label">Run</span></button>
        </div>
        <div class="edit"><pre class="gutter" id="gutter">1</pre><div class="editor-code"><pre class="sql-highlight" id="sql-highlight" aria-hidden="true"></pre><textarea class="editor" id="editor" spellcheck="false" aria-label="SQL editor" placeholder="Select an object to inspect its definition or start a query."></textarea></div></div>
        <div class="resize-handle" id="results-resize" role="separator" aria-label="Resize SQL results pane" aria-orientation="horizontal" aria-valuemin="145" aria-valuemax="520" aria-valuenow="205" tabindex="0" title="Drag to resize results; use arrow keys"></div>
        <section class="results"><div class="result-tabs"><button class="result-tab active" data-panel="output">Output</button><button class="result-tab" data-panel="columns">Columns</button><button class="result-tab" data-panel="indexes">Indexes</button><button class="result-tab" data-panel="constraints">Constraints</button><span class="meta" id="meta"></span></div><div class="result-content" id="result"><div class="message">Choose an object or run a SQL statement.</div></div></section>
      </main>
    </div>
    <div class="object-menu" id="object-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-menu-action="show">Show definition</button>
      <button type="button" role="menuitem" data-menu-action="edit">Edit definition</button>
      <button type="button" role="menuitem" data-menu-action="select-1000">Select 1000 records</button>
    </div>
  </div>
  <script>
    const $=id=>document.getElementById(id), state={db:"",schema:"",selected:null,details:null,panel:"output",editors:[{id:1,title:"query.sql",value:"",selected:null,details:null,readOnly:false,dirty:false,panel:"output"}],activeEditorId:1,nextEditorId:2}, editor=$("editor"), tree=$("tree"), highlight=$("sql-highlight"), editorTabs=$("editor-tabs");
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||`Request failed (${response.status})`);return data}
    function message(text,kind=""){ $("result").innerHTML=`<div class="message ${kind}">${escapeHtml(text)}</div>`;$("meta").textContent="" }
    function currentEditor(){return state.editors.find(tab=>tab.id===state.activeEditorId)}
    function saveCurrentEditor(){const tab=currentEditor();if(!tab)return;tab.value=editor.value;tab.selected=state.selected;tab.details=state.details;tab.readOnly=editor.readOnly;tab.dirty=!$("dirty").hidden;tab.panel=state.panel}
    function renderEditorTabs(){editorTabs.innerHTML=state.editors.map(tab=>`<div class="editor-tab ${tab.id===state.activeEditorId?"active":""}"><button class="editor-tab-title" type="button" role="tab" aria-selected="${tab.id===state.activeEditorId}" data-tab-select="${tab.id}" title="${escapeHtml(tab.title)}">${escapeHtml(tab.title)}${tab.dirty?'<span class="editor-tab-dirty"> ●</span>':""}</button><button class="editor-tab-close" type="button" data-tab-close="${tab.id}" aria-label="Close ${escapeHtml(tab.title)}" title="Close editor">×</button></div>`).join("")}
    function activateEditor(id){saveCurrentEditor();const tab=state.editors.find(item=>item.id===id);if(!tab)return;state.activeEditorId=id;state.selected=tab.selected;state.details=tab.details;state.panel=tab.panel||"output";editor.value=tab.value;editor.readOnly=tab.readOnly;editor.parentElement.classList.toggle("readonly",tab.readOnly);$("active-title").textContent=tab.title;$("dirty").hidden=!tab.dirty;renderEditorTabs();syncEditMode();lines();if(tab.selected)$("breadcrumb").textContent=`${state.db} / ${tab.selected.schema} / ${tab.selected.name}`.toUpperCase();panel(tab.panel||"output")}
    function createEditor(){saveCurrentEditor();const id=state.nextEditorId++,title=`query-${id}.sql`;state.editors.push({id,title,value:"",selected:null,details:null,readOnly:false,dirty:false,panel:"output"});state.activeEditorId=id;state.selected=null;state.details=null;setEditor("",title,false);panel("output");message("Enter SQL and run it with your Databricks identity.");editor.focus()}
    function closeEditor(id){saveCurrentEditor();const index=state.editors.findIndex(tab=>tab.id===id);if(index<0)return;const wasActive=id===state.activeEditorId;state.editors.splice(index,1);if(!state.editors.length){const nextId=state.nextEditorId++;state.editors.push({id:nextId,title:`query-${nextId}.sql`,value:"",selected:null,details:null,readOnly:false,dirty:false,panel:"output"})}if(wasActive)activateEditor(state.editors[Math.min(index,state.editors.length-1)].id);else renderEditorTabs()}
    function syncEditMode(){const button=$("edit-mode"),available=Boolean(state.selected&&state.details?.definition);button.hidden=!available;const editing=available&&!editor.readOnly;button.querySelector(".label").textContent=editing?"Done":"Edit";button.title=editing?"Finish editing object definition":"Edit selected object definition";button.setAttribute("aria-label",button.title)}
    const sqlTokens=/(--[^\n]*|\/\*[\s\S]*?\*\/|'(?:''|[^'])*'|"(?:""|[^"])*"|\b\d+(?:\.\d+)?\b|\b[a-z_][a-z_0-9]*\b)/gi;
    const sqlKeywords=new Set("select from where join left right inner outer on as create alter drop table view materialized function procedure index insert into values update set delete returning with recursive group by order having limit offset union all distinct and or not null is in exists case when then else end primary key foreign references unique check default constraint begin commit rollback grant revoke cascade if truncate explain analyze asc desc true false using include conflict do nothing generated always identity stored language returns security definer replace temporary temp filter over partition rows between current user".split(" "));
    const sqlTypes=new Set("bigint smallint integer int serial bigserial numeric decimal real double precision text varchar char boolean bool date time timestamp json jsonb uuid bytea record void".split(" "));
    function updateHighlight(){let html="",offset=0;for(const match of editor.value.matchAll(sqlTokens)){const token=match[0],lower=token.toLowerCase();html+=escapeHtml(editor.value.slice(offset,match.index));let kind="sql-identifier";if(token.startsWith("--")||token.startsWith("/*"))kind="sql-comment";else if(token.startsWith("'"))kind="sql-string";else if(/^\d/.test(token))kind="sql-number";else if(sqlKeywords.has(lower))kind="sql-keyword";else if(sqlTypes.has(lower))kind="sql-type";else if(/^\w+$/.test(token)&&/^\s*\(/.test(editor.value.slice(match.index+token.length)))kind="sql-function";html+=`<span class="${kind}">${escapeHtml(token)}</span>`;offset=match.index+token.length}html+=escapeHtml(editor.value.slice(offset));highlight.innerHTML=html+(editor.value.endsWith("\n")?" ":"");highlight.scrollTop=editor.scrollTop;highlight.scrollLeft=editor.scrollLeft}
    function setEditor(text,title,readOnly=Boolean(state.selected)){editor.value=text||"";editor.readOnly=readOnly;editor.parentElement.classList.toggle("readonly",readOnly);$("active-title").textContent=title||"query.sql";$("dirty").hidden=true;const tab=currentEditor();if(tab){tab.title=title||tab.title;tab.value=editor.value;tab.selected=state.selected;tab.details=state.details;tab.readOnly=readOnly;tab.dirty=false}renderEditorTabs();syncEditMode();lines()}
    function lines(){ $("gutter").textContent=Array.from({length:editor.value.split("\n").length},(_,i)=>i+1).join("\n");$("gutter").scrollTop=editor.scrollTop;updateHighlight()}
    function icon(kind){return ({table:"▦","partitioned table":"▦","foreign table":"▦",view:"◫","materialized view":"◧",sequence:"↕",index:"⌕","partitioned index":"⌕",function:"ƒ",procedure:"ƒ",aggregate:"ƒ",trigger:"ϟ",enum:"◇",domain:"◈","composite type":"◇",type:"◇"})[kind]||"·"}
    function filtered(item){const q=$("filter").value.trim().toLowerCase();return !q||`${item.name} ${item.kind} ${item.identity_args||""}`.toLowerCase().includes(q)}
    async function loadSchemas(){if(!state.db)return;tree.innerHTML='<div class="empty">Loading schemas...</div>';try{const{schemas}=await api(`/api/schemas?database=${encodeURIComponent(state.db)}`);const visible=schemas.filter(x=>$("system").checked||!(x.name==="pg_catalog"||x.name==="information_schema"||x.name.startsWith("pg_toast")));tree.innerHTML=visible.map(x=>`<div class="schema" data-schema="${escapeHtml(x.name)}"><button class="row schema-name" data-action="expand" data-schema="${escapeHtml(x.name)}"><span class="chev">▸</span><span class="glyph">▤</span><span class="name">${escapeHtml(x.name)}</span></button><div class="children" hidden></div></div>`).join("")||'<div class="empty">No schemas available.</div>';if(state.schema&&visible.some(x=>x.name===state.schema))await expand(state.schema)}catch(e){tree.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}}
    async function expand(schema){const wrapper=[...tree.querySelectorAll(".schema")].find(x=>x.dataset.schema===schema);if(!wrapper)return;const child=wrapper.querySelector(".children"),button=wrapper.querySelector("[data-action=expand]");if(!child.hidden&&child.dataset.loaded){child.hidden=true;button.querySelector(".chev").textContent="▸";return}child.hidden=false;button.querySelector(".chev").textContent="▾";if(child.dataset.loaded)return;child.innerHTML='<div class="empty">Loading objects...</div>';try{const{objects}=await api(`/api/objects?database=${encodeURIComponent(state.db)}&schema=${encodeURIComponent(schema)}&show_system=${$("system").checked}`),groups={};objects.filter(filtered).forEach(o=>(groups[o.kind]??=[]).push(o));child.innerHTML=Object.entries(groups).map(([kind,items])=>`<div class="group"><div class="group-title">${escapeHtml(kind)}s</div>${items.map(o=>{const identity=o.identity_args||"",key=[schema,kind,o.name,identity].join("\u0000");return `<button class="row object ${state.selected?.key===key?"active":""}" data-action="select" data-key="${escapeHtml(key)}" data-schema="${escapeHtml(schema)}" data-kind="${escapeHtml(kind)}" data-name="${escapeHtml(o.name)}" data-identity="${escapeHtml(identity)}" title="${escapeHtml(o.name)}"><span class="glyph">${icon(kind)}</span><span class="name">${escapeHtml(o.name)}${identity?` (${escapeHtml(identity)})`:""}</span></button>`}).join("")}</div>`).join("")||'<div class="empty">No matching objects.</div>';child.dataset.loaded="true";$("count").textContent=`${objects.length} objects`}catch(e){child.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}}
    function renderTable(rows,columns){if(!rows.length)return'<div class="message">No rows returned.</div>';return`<table class="table"><thead><tr>${columns.map(x=>`<th>${escapeHtml(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(col=>{const v=row[col];return`<td class="${v===null?"null":""}" title="${escapeHtml(v)}">${v===null?"NULL":escapeHtml(typeof v==="object"?JSON.stringify(v):v)}</td>`}).join("")}</tr>`).join("")}</tbody></table>`}
    function panel(name){state.panel=name;document.querySelectorAll(".result-tab").forEach(x=>x.classList.toggle("active",x.dataset.panel===name));if(name==="output")return;if(!state.details){message("Select an object to inspect its metadata.");return}const rows=state.details[name]||[];$("result").innerHTML=renderTable(rows,rows.length?Object.keys(rows[0]):[]);$("meta").textContent=`${rows.length} ${name}`}
    async function selectObject(button){const item={key:button.dataset.key,schema:button.dataset.schema,kind:button.dataset.kind,name:button.dataset.name,identity_args:button.dataset.identity||""};state.selected=item;state.schema=item.schema;tree.querySelectorAll(".row.active").forEach(x=>x.classList.remove("active"));button.classList.add("active");$("breadcrumb").textContent=`${state.db} / ${item.schema} / ${item.name}`.toUpperCase();$("result").innerHTML='<div class="message">Loading definition...</div>';try{const query=new URLSearchParams({database:state.db,schema:item.schema,name:item.name,kind:item.kind,identity_args:item.identity_args});state.details=await api(`/api/object?${query}`);setEditor(state.details.definition,`${item.name}.sql`);panel("columns");$("meta").textContent=item.kind.toUpperCase()}catch(e){message(e.message,"error")}$("explorer").classList.remove("open")}
    async function run(){const button=$("run");button.disabled=true;message("Executing as your Databricks user...");try{const result=await api("/api/query",{method:"POST",body:JSON.stringify({database:state.db,query:editor.value})});if(result.columns.length)$("result").innerHTML=renderTable(result.rows,result.columns);else message(result.command||"Statement completed.","success");$("meta").textContent=`${result.row_count} rows · ${result.elapsed_ms} ms${result.truncated?" · first 500 shown":""}`;panel("output");$("dirty").hidden=true;await loadSchemas()}catch(e){message(e.message,"error")}finally{button.disabled=false}}
    async function boot(){try{const[who,data]=await Promise.all([api("/api/whoami"),api("/api/databases")]);$("user").textContent=who.username;$("host").textContent=location.hostname;$("database").innerHTML=data.databases.map(x=>`<option value="${escapeHtml(x.name)}">${escapeHtml(x.name)}</option>`).join("");if(!data.databases.length)throw Error("No databases are visible to this user.");state.db=data.databases.some(x=>x.name===data.default)?data.default:data.databases[0].name;$("database").value=state.db;await loadSchemas()}catch(e){$("host").textContent="Connection unavailable";$("user").textContent="Authorization required";tree.innerHTML=`<div class="empty">${escapeHtml(e.message)}<br><br>Check user authorization and Lakebase access.</div>`;message(e.message,"error")}}
    tree.addEventListener("click",e=>{const b=e.target.closest("button[data-action]");if(!b)return;if(b.dataset.action==="expand")expand(b.dataset.schema);if(b.dataset.action==="select")selectObject(b)});
    const objectMenu=$("object-menu");let menuTarget=null;
    tree.addEventListener("contextmenu",e=>{const button=e.target.closest('button[data-action="select"]');if(!button)return;e.preventDefault();menuTarget=button;objectMenu.querySelector('[data-menu-action="select-1000"]').hidden=!["table","partitioned table","foreign table","view","materialized view"].includes(button.dataset.kind);objectMenu.hidden=false;objectMenu.style.left=`${Math.max(8,Math.min(e.clientX,innerWidth-objectMenu.offsetWidth-8))}px`;objectMenu.style.top=`${Math.max(8,Math.min(e.clientY,innerHeight-objectMenu.offsetHeight-8))}px`});
    objectMenu.addEventListener("click",async e=>{const action=e.target.closest("[data-menu-action]")?.dataset.menuAction,button=menuTarget;if(!action||!button)return;objectMenu.hidden=true;menuTarget=null;if(action==="show")await selectObject(button);else if(action==="edit"){await selectObject(button);if(state.details){editor.readOnly=false;editor.parentElement.classList.remove("readonly");syncEditMode();editor.focus()}}else if(action==="select-1000"){const quote=value=>'"'+value.replace(/"/g,'""')+'"';state.selected=null;state.details=null;setEditor(`SELECT * FROM ${quote(button.dataset.schema)}.${quote(button.dataset.name)} LIMIT 1000;`,"select-1000.sql",false);panel("output");await run()}});
    document.addEventListener("click",e=>{if(!objectMenu.contains(e.target))objectMenu.hidden=true});document.addEventListener("keydown",e=>{if(e.key==="Escape")objectMenu.hidden=true});
    $("edit-mode").addEventListener("click",()=>{if(!state.selected||!state.details)return;editor.readOnly=!editor.readOnly;syncEditMode();if(!editor.readOnly)editor.focus()});
    $("database").addEventListener("change",()=>setEditor("","query.sql",false));
    const resultsResize=$("results-resize");let resizeStart=null;
    function setResultsHeight(height){const main=resultsResize.parentElement,toolbarHeight=window.matchMedia("(max-width: 760px)").matches?44:45,max=Math.max(145,Math.min(520,main.clientHeight-toolbarHeight-132)),next=Math.max(145,Math.min(max,height));main.style.gridTemplateRows=`${toolbarHeight}px minmax(120px, 1fr) 12px ${next}px`;resultsResize.setAttribute("aria-valuemax",String(max));resultsResize.setAttribute("aria-valuenow",String(Math.round(next)))}
    resultsResize.addEventListener("mousedown",e=>{if(e.button!==0)return;e.preventDefault();resizeStart={y:e.clientY,height:document.querySelector(".results").getBoundingClientRect().height};document.body.classList.add("resizing")});
    document.addEventListener("mousemove",e=>{if(!resizeStart)return;setResultsHeight(resizeStart.height+resizeStart.y-e.clientY)});
    function endResize(){resizeStart=null;document.body.classList.remove("resizing")}
    document.addEventListener("mouseup",endResize);window.addEventListener("blur",endResize);
    const sidebarResize=$("sidebar-resize"),layout=sidebarResize.parentElement;let sidebarStart=null;
    function setSidebarWidth(width){const max=Math.max(220,Math.min(480,layout.clientWidth-340)),next=Math.max(220,Math.min(max,width));layout.style.gridTemplateColumns=`${next}px 10px minmax(0,1fr)`;sidebarResize.setAttribute("aria-valuemax",String(max));sidebarResize.setAttribute("aria-valuenow",String(Math.round(next)))}
    sidebarResize.addEventListener("mousedown",e=>{if(e.button!==0)return;e.preventDefault();sidebarStart={x:e.clientX,width:$("explorer").getBoundingClientRect().width};document.body.classList.add("resizing-columns")});
    document.addEventListener("mousemove",e=>{if(sidebarStart)setSidebarWidth(sidebarStart.width+e.clientX-sidebarStart.x)});
    function endSidebarResize(){sidebarStart=null;document.body.classList.remove("resizing-columns")}
    document.addEventListener("mouseup",endSidebarResize);window.addEventListener("blur",endSidebarResize);
    sidebarResize.addEventListener("keydown",e=>{const width=$("explorer").getBoundingClientRect().width;if(e.key==="ArrowLeft")setSidebarWidth(width-20);else if(e.key==="ArrowRight")setSidebarWidth(width+20);else return;e.preventDefault()});
    resultsResize.addEventListener("keydown",e=>{const current=document.querySelector(".results").getBoundingClientRect().height,max=Math.max(145,Math.min(520,resultsResize.parentElement.clientHeight-185));let next=current;if(e.key==="ArrowUp")next+=24;else if(e.key==="ArrowDown")next-=24;else if(e.key==="Home")next=145;else if(e.key==="End")next=max;else return;e.preventDefault();setResultsHeight(next)});
    editor.addEventListener("input",()=>{$("dirty").hidden=false;const tab=currentEditor();if(tab){tab.value=editor.value;tab.dirty=true}renderEditorTabs();lines()});editor.addEventListener("scroll",()=>{$("gutter").scrollTop=editor.scrollTop;highlight.scrollTop=editor.scrollTop;highlight.scrollLeft=editor.scrollLeft});editor.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();document.execCommand("insertText",false,"  ")}if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();run()}});
    $("run").addEventListener("click",run);$("refresh").addEventListener("click",loadSchemas);$("database").addEventListener("change",e=>{state.db=e.target.value;state.schema="";state.selected=null;state.details=null;$("breadcrumb").textContent=`${state.db} / DATABASE EXPLORER`.toUpperCase();loadSchemas()});$("system").addEventListener("change",loadSchemas);
    $("filter").addEventListener("input",()=>{const open=[...tree.querySelectorAll(".children[data-loaded]")].map(x=>x.closest(".schema").dataset.schema);loadSchemas().then(()=>open.forEach(expand))});
    editorTabs.addEventListener("click",e=>{const close=e.target.closest("[data-tab-close]");if(close){closeEditor(Number(close.dataset.tabClose));return}const tab=e.target.closest("[data-tab-select]");if(tab)activateEditor(Number(tab.dataset.tabSelect))});
    renderEditorTabs();$("new").addEventListener("click",createEditor);$("copy").addEventListener("click",()=>{if(state.details?.definition)navigator.clipboard.writeText(state.details.definition)});
    document.querySelectorAll(".result-tab").forEach(x=>x.addEventListener("click",()=>panel(x.dataset.panel)));$("mobile-menu").addEventListener("click",()=>$("explorer").classList.toggle("open"));boot();
  </script>
</body>
</html>
