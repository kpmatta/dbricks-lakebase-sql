  <style>
    .layout { grid-template-columns: var(--explorer-width, 285px) 10px minmax(0, 1fr); }
    .editor[readonly] { color: #7e8c82; caret-color: transparent; cursor: default; }
    .editor-code.readonly .sql-highlight { filter: saturate(.45) brightness(.72); }
    .main { grid-template-rows: 45px minmax(120px, 1fr) 12px minmax(145px, var(--results-height, 205px)); }
    .resize-handle { position: relative; z-index: 1; display: grid; place-items: center; min-height: 12px; background: #171d19; cursor: row-resize; touch-action: none; user-select: none; }
    .resize-handle::after { content: ""; width: 42px; height: 3px; border-block: 1px solid #68766c; }
    .resize-handle:hover::after, .resize-handle:focus-visible::after { border-color: var(--mint); }
    .resize-handle:focus-visible { outline: 1px solid var(--mint); outline-offset: -1px; }
    body.resizing { cursor: row-resize; user-select: none; }
    body.resizing-columns { cursor: col-resize; user-select: none; }
    .sidebar-resize { position: relative; z-index: 2; display: grid; place-items: center; cursor: col-resize; touch-action: none; user-select: none; }
    .sidebar-resize::after { content: ""; width: 2px; height: 38px; background: #46534a; }
    .sidebar-resize:hover::after, .sidebar-resize:focus-visible::after { background: var(--mint); }
    .sidebar-resize:focus-visible { outline: 1px solid var(--mint); outline-offset: -1px; }
    .editor-code { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--code); }
    .sql-highlight, .editor { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 16px 18px 24px 7px; border: 0; font: 12px/1.7 var(--mono); tab-size: 2; white-space: pre; overflow: auto; }
    .sql-highlight { pointer-events: none; color: #d8e3da; }
    .editor { z-index: 1; resize: none; outline: 0; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--green); }
    .editor::selection { background: #739a7955; color: transparent; }
    .editor:placeholder-shown { -webkit-text-fill-color: #65736a; }
    .sql-keyword { color: #e5bd79; }.sql-type { color: #8fc8d5; }.sql-function { color: #87c9a7; }
    .sql-string { color: #b5d69a; }.sql-number { color: #d6a7d0; }.sql-comment { color: #78867a; font-style: italic; }.sql-identifier { color: #a8c4df; }
    .object-menu { position: fixed; z-index: 20; min-width: 190px; padding: 4px; border: 1px solid var(--line); border-radius: 5px; background: #202722; box-shadow: 0 8px 24px #0008; }
    .object-menu[hidden], .btn[hidden] { display: none !important; }
    .object-menu button { display: block; width: 100%; padding: 7px 9px; border: 0; border-radius: 3px; background: transparent; color: var(--text); text-align: left; font-size: 11px; }
    .object-menu button[hidden] { display: none; }
    .object-menu button:hover, .object-menu button:focus-visible { outline: 0; background: var(--hover); }
    .title { min-width: 0; flex: 1; gap: 10px; margin-right: 0; }
    .editor-tabs { display: flex; min-width: 0; flex: 1; align-items: center; gap: 3px; overflow-x: auto; }
    .editor-tab { display: inline-flex; min-width: 0; max-width: 210px; align-items: center; border: 1px solid transparent; border-radius: 4px; background: transparent; }
    .editor-tab.active { border-color: #3a493e; background: #222b25; }
    .editor-tab-title { min-width: 0; overflow: hidden; padding: 4px 7px; border: 0; background: transparent; color: var(--muted); font: 10px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .editor-tab.active .editor-tab-title { color: var(--text); }
    .editor-tab-close { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--quiet); }
    .editor-tab-close:hover { background: var(--hover); color: var(--text); }
    .editor-tab-dirty { color: var(--amber); }
    #active-title, #dirty { display: none; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .sidebar-resize { display: none; } .main { grid-template-rows: 44px minmax(120px, 1fr) 12px minmax(145px, var(--results-height, 27vh)); } }
  </style>

  <script>
    const $=id=>document.getElementById(id), state={db:"",schema:"",selected:null,details:null,panel:"output",lastResult:null,runMode:"limit",editors:[{id:1,title:"query.sql",value:"",selected:null,details:null,readOnly:false,dirty:false,panel:"output"}],activeEditorId:1,nextEditorId:2}, editor=$("editor"), tree=$("tree"), highlight=$("sql-highlight"), editorTabs=$("editor-tabs");
    const preferences={theme:localStorage.getItem("lakebase-theme")||"dark",fontSize:localStorage.getItem("lakebase-font-size")||"medium"},fontScales={small:.9,medium:1,large:1.12};

    function message(text,kind=""){ $("result").innerHTML=`<div class="message ${kind}">${escapeHtml(text)}</div>`;$("meta").textContent="" }

    function activateEditor(id){saveCurrentEditor();const tab=state.editors.find(item=>item.id===id);if(!tab)return;state.activeEditorId=id;state.selected=tab.selected;state.details=tab.details;state.panel=tab.panel||"output";editor.value=tab.value;editor.readOnly=tab.readOnly;editor.parentElement.classList.toggle("readonly",tab.readOnly);$("active-title").textContent=tab.title;$("dirty").hidden=!tab.dirty;renderEditorTabs();syncEditMode();lines();if(tab.selected)$("breadcrumb").textContent=`${state.db} / ${tab.selected.schema} / ${tab.selected.name}`.toUpperCase();panel(tab.panel||"output")}

    function closeEditor(id){saveCurrentEditor();const index=state.editors.findIndex(tab=>tab.id===id);if(index<0)return;const wasActive=id===state.activeEditorId;state.editors.splice(index,1);if(!state.editors.length){const nextId=state.nextEditorId++;state.editors.push({id:nextId,title:`query-${nextId}.sql`,value:"",selected:null,details:null,readOnly:false,dirty:false,panel:"output"})}if(wasActive)activateEditor(state.editors[Math.min(index,state.editors.length-1)].id);else renderEditorTabs()}
    function syncEditMode(){const button=$("edit-mode"),available=Boolean(state.selected&&state.details?.definition);button.hidden=!available;const editing=available&&!editor.readOnly;button.querySelector(".label").textContent=editing?"Done":"Edit";button.title=editing?"Finish editing object definition":"Edit selected object definition";button.setAttribute("aria-label",button.title)}
    const sqlTokens=/(--[^\n]*|\/\*[\s\S]*?\*\/|'(?:''|[^'])*'|"(?:""|[^"])*"|\b\d+(?:\.\d+)?\b|\b[a-z_][a-z_0-9]*\b)/gi;
    const sqlKeywords=new Set("select from where join left right inner outer on as create alter drop table view materialized function procedure index insert into values update set delete returning with recursive group by order having limit offset union all distinct and or not null is in exists case when then else end primary key foreign references unique check default constraint begin commit rollback grant revoke cascade if truncate explain analyze asc desc true false using include conflict do nothing generated always identity stored language returns security definer replace temporary temp filter over partition rows between current user".split(" "));
    const sqlTypes=new Set("bigint smallint integer int serial bigserial numeric decimal real double precision text varchar char boolean bool date time timestamp json jsonb uuid bytea record void".split(" "));
    const completionState={items:[],index:0},suggestions=$("sql-suggestions");
    function hideSuggestions(){suggestions.hidden=true;completionState.items=[];completionState.index=0}
    function completionCandidates(){const items=[...sqlKeywords].map(name=>({name,type:"keyword"}));tree.querySelectorAll(".schema").forEach(schema=>items.push({name:schema.dataset.schema,type:"schema"}));tree.querySelectorAll(".row.object").forEach(object=>items.push({name:object.dataset.name,type:object.dataset.kind}));(state.details?.columns||[]).forEach(column=>items.push({name:column.name,type:"column"}));const seen=new Set;return items.filter(item=>{const key=item.name.toLowerCase();if(seen.has(key))return false;seen.add(key);return true})}
    function showSuggestions(){if(editor.readOnly){hideSuggestions();return}const before=editor.value.slice(0,editor.selectionStart),match=before.match(/[A-Za-z_][\w$]*$/);if(!match){hideSuggestions();return}const query=match[0].toLowerCase();completionState.items=completionCandidates().filter(item=>item.name.toLowerCase().startsWith(query)).slice(0,10);completionState.index=0;if(!completionState.items.length){hideSuggestions();return}suggestions.innerHTML=completionState.items.map((item,index)=>`<button class="sql-suggestion ${index===0?"active":""}" type="button" role="option" aria-selected="${index===0}" data-completion-index="${index}"><span>${escapeHtml(item.name)}</span><small>${escapeHtml(item.type)}</small></button>`).join("");suggestions.hidden=false}
    function chooseSuggestion(index=completionState.index){const item=completionState.items[index];if(!item)return;const position=editor.selectionStart,before=editor.value.slice(0,position),after=editor.value.slice(position),start=before.search(/[A-Za-z_][\w$]*$/);editor.value=before.slice(0,start)+item.name+after;const cursor=start+item.name.length;editor.setSelectionRange(cursor,cursor);hideSuggestions();editor.focus();updateHighlight();lines()}
    function moveSuggestion(delta){if(!completionState.items.length)return;completionState.index=(completionState.index+delta+completionState.items.length)%completionState.items.length;suggestions.querySelectorAll(".sql-suggestion").forEach((item,index)=>{const active=index===completionState.index;item.classList.toggle("active",active);item.setAttribute("aria-selected",String(active))})}
    function updateHighlight(){let html="",offset=0;for(const match of editor.value.matchAll(sqlTokens)){const token=match[0],lower=token.toLowerCase();html+=escapeHtml(editor.value.slice(offset,match.index));let kind="sql-identifier";if(token.startsWith("--")||token.startsWith("/*"))kind="sql-comment";else if(token.startsWith("'"))kind="sql-string";else if(/^\d/.test(token))kind="sql-number";else if(sqlKeywords.has(lower))kind="sql-keyword";else if(sqlTypes.has(lower))kind="sql-type";else if(/^\w+$/.test(token)&&/^\s*\(/.test(editor.value.slice(match.index+token.length)))kind="sql-function";html+=`<span class="${kind}">${escapeHtml(token)}</span>`;offset=match.index+token.length}html+=escapeHtml(editor.value.slice(offset));highlight.innerHTML=html+(editor.value.endsWith("\n")?" ":"");highlight.scrollTop=editor.scrollTop;highlight.scrollLeft=editor.scrollLeft}
    function setEditor(text,title,readOnly=Boolean(state.selected)){editor.value=text||"";editor.readOnly=readOnly;editor.parentElement.classList.toggle("readonly",readOnly);$("active-title").textContent=title||"query.sql";$("dirty").hidden=true;const tab=currentEditor();if(tab){tab.title=title||tab.title;tab.value=editor.value;tab.selected=state.selected;tab.details=state.details;tab.readOnly=readOnly;tab.dirty=false}renderEditorTabs();syncEditMode();lines()}
    function formatSqlText(value){const protectedParts=[];let text=value.replace(/(--[^\n]*|\/\*[\s\S]*?\*\/|'(?:''|[^'])*'|"(?:""|[^"])*")/g,match=>{protectedParts.push(match);return `\u0001${protectedParts.length-1}\u0002`});text=text.replace(/[ \t]+/g," ").replace(/\s*,\s*/g,",\n  ").replace(/\s+(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|JOIN|LEFT JOIN|RIGHT JOIN|INNER JOIN|OUTER JOIN|UNION|VALUES|SET)\b/gi,"\n$1 ").replace(/;\s*/g,";\n").trim();return text.replace(/\u0001(\d+)\u0002/g,(_,index)=>protectedParts[index])}
    function formatSql(){const start=editor.selectionStart,end=editor.selectionEnd,source=start===end?editor.value:editor.value.slice(start,end),formatted=formatSqlText(source);if(!formatted)return;editor.value=start===end?formatted:editor.value.slice(0,start)+formatted+editor.value.slice(end);const nextStart=start===end?0:start;editor.setSelectionRange(nextStart,nextStart+formatted.length);editor.dispatchEvent(new Event("input"));editor.focus()}
    function lines(){ $("gutter").textContent=Array.from({length:editor.value.split("\n").length},(_,i)=>i+1).join("\n");$("gutter").scrollTop=editor.scrollTop;updateHighlight()}
    function icon(kind){return ({table:"▦","partitioned table":"▦","foreign table":"▦",view:"◫","materialized view":"◧",sequence:"↕",index:"⌕","partitioned index":"⌕",function:"ƒ",procedure:"ƒ",aggregate:"ƒ",trigger:"ϟ",enum:"◇",domain:"◈","composite type":"◇",type:"◇"})[kind]||"·"}
    function filtered(item){const q=$("filter").value.trim().toLowerCase();return !q||`${item.name} ${item.kind} ${item.identity_args||""}`.toLowerCase().includes(q)}
    async function loadSchemas(){if(!state.db)return;const openSchemas=[...tree.querySelectorAll(".schema")].filter(x=>!x.querySelector(".children").hidden).map(x=>x.dataset.schema),openGroups=new Set([...tree.querySelectorAll(".group-title[aria-expanded=true]")].map(x=>`${x.closest(".schema").dataset.schema}\u0000${x.dataset.kind}`));tree.innerHTML='<div class="empty">Loading schemas...</div>';try{const{schemas}=await api(`/api/schemas?database=${encodeURIComponent(state.db)}`);const visible=schemas.filter(x=>$('system').checked||!(x.name==="__db_system"||x.name==="pg_catalog"||x.name==="information_schema"||x.name.startsWith("pg_toast")));tree.innerHTML=visible.map(x=>`<div class="schema" data-schema="${escapeHtml(x.name)}"><button class="row schema-name" data-action="expand" data-schema="${escapeHtml(x.name)}"><span class="chev">▸</span><span class="glyph">▤</span><span class="name">${escapeHtml(x.name)}</span></button><div class="children" hidden></div></div>`).join("")||'<div class="empty">No schemas available.</div>';const schemasToExpand=[...new Set([...openSchemas,...(state.schema?[state.schema]:[])])];for(const schema of schemasToExpand){if(!visible.some(x=>x.name===schema))continue;await expand(schema);const wrapper=[...tree.querySelectorAll(".schema")].find(x=>x.dataset.schema===schema);wrapper.querySelectorAll(".group-title").forEach(group=>{const shouldOpen=openSchemas.includes(schema)?openGroups.has(`${schema}\u0000${group.dataset.kind}`):group.dataset.kind==="table";if(shouldOpen!==(group.getAttribute("aria-expanded")==="true"))toggleGroup(group)})}}catch(e){tree.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}}
    async function expand(schema){const wrapper=[...tree.querySelectorAll(".schema")].find(x=>x.dataset.schema===schema);if(!wrapper)return;const child=wrapper.querySelector(".children"),button=wrapper.querySelector("[data-action=expand]");if(!child.hidden&&child.dataset.loaded){child.hidden=true;button.querySelector(".chev").textContent="▸";return}child.hidden=false;button.querySelector(".chev").textContent="▾";if(child.dataset.loaded)return;child.innerHTML='<div class="empty">Loading objects...</div>';try{const{objects}=await api(`/api/objects?database=${encodeURIComponent(state.db)}&schema=${encodeURIComponent(schema)}&show_system=${$("system").checked}`),groups={};objects.filter(filtered).forEach(o=>(groups[o.kind]??=[]).push(o));child.innerHTML=Object.entries(groups).sort(([a],[b])=>{const rank=kind=>kind==="table"?0:1;return rank(a)-rank(b)||a.localeCompare(b)}).map(([kind,items])=>`<div class="group"><button class="group-title" type="button" data-action="toggle-group" data-kind="${escapeHtml(kind)}" aria-expanded="true"><span>${escapeHtml(kind)}s</span><span class="group-chevron">▾</span></button><div class="group-items">${items.map(o=>{const identity=o.identity_args||"",key=[schema,kind,o.name,identity].join("\u0000");return `<button class="row object ${state.selected?.key===key?"active":""}" data-action="select" data-key="${escapeHtml(key)}" data-schema="${escapeHtml(schema)}" data-kind="${escapeHtml(kind)}" data-name="${escapeHtml(o.name)}" data-identity="${escapeHtml(identity)}" title="${escapeHtml(o.name)}"><span class="glyph">${icon(kind)}</span><span class="name">${escapeHtml(o.name)}${identity?` (${escapeHtml(identity)})`:""}</span></button>`}).join("")}</div></div>`).join("")||'<div class="empty">No matching objects.</div>';child.querySelectorAll('.group-title:not([data-kind="table"])').forEach(toggleGroup);child.dataset.loaded="true";$("count").textContent=`${objects.length} objects`}catch(e){child.innerHTML=`<div class="empty">${escapeHtml(e.messag     function toggleGroup(button){const items=button.nextElementSibling,expanded=button.getAttribute("aria-expanded")==="true";items.hidden=expanded;button.setAttribute("aria-expanded",String(!expanded));button.querySelector(".group-chevron").textContent=expanded?"▸":"▾"}
    function renderTable(rows,columns){if(!rows.length)return'<div class="message">No rows returned.</div>';return`<table class="table"><thead><tr>${columns.map(x=>`<th>${escapeHtml(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(col=>{const v=row[col];return`<td class="${v===null?"null":""}" title="${escapeHtml(v)}">${v===null?"NULL":escapeHtml(typeof v==="object"?JSON.stringify(v):v)}</td>`}).join("")}</tr>`).join("")}</tbody></table>`}
    function renderOutput(){const result=state.lastResult;if(!result){message("Choose an object or run a SQL statement.");return}if(result.columns.length)$("result").innerHTML=renderTable(result.rows,result.columns);else message(result.command||"Statement completed.","success");$("meta").textContent=`${result.row_count} rows · ${result.elapsed_ms} ms${result.truncated?" · first 500 shown":""}`}
    function panel(name,explicit=false){if(name==="columns"&&!explicit&&state.panel==="output"&&state.lastResult){renderOutput();return}state.panel=name;document.querySelectorAll(".result-tab").forEach(x=>x.classList.toggle("active",x.dataset.panel===name));if(name==="output"){renderOutput();return}if(!state.details){message("Select an object to inspect its metadata.");return}const rows=state.details[name]||[];$("result").innerHTML=renderTable(rows,rows.length?Object.keys(rows[0]):[]);$("meta").textContent=`${rows.length} ${name}`}
    async function selectObject(button){const item={key:button.dataset.key,schema:button.dataset.schema,kind:button.dataset.kind,name:button.dataset.name,identity_args:button.dataset.identity||""};state.selected=item;state.schema=item.schema;tree.querySelectorAll(".row.active").forEach(x=>x.classList.remove("active"));button.classList.add("active");$("breadcrumb").textContent=`${state.db} / ${item.schema} / ${item.name}`.toUpperCase();$("result").innerHTML='<div class="message">Loading definition...</div>';try{const query=new URLSearchParams({database:state.db,schema:item.schema,name:item.name,kind:item.kind,identity_args:item.identity_args});state.details=await api(`/api/object?${query}`);setEditor(state.details.definition,`${item.name}.sql`);panel("columns");$("meta").textContent=item.kind.toUpperCase()}catch(e){message(e.message,"error")}$("explorer").classList.remove("open")}
    function selectedSql(){return editor.value.slice(editor.selectionStart,editor.selectionEnd).trim()}
    function statementAtCursor(){const text=editor.value,position=editor.selectionStart,statements=text.split(/;(?=(?:[^'\"]|'(?:''|[^'])*'|\"(?:\"\"|[^\"])*\")*$)/);let offset=0,first="";for(const statement of statements){const trimmed=statement.trim(),leading=statement.search(/\S/);if(trimmed&&!first)first=trimmed;if(leading>=0){const start=offset+leading,end=offset+statement.trimEnd().length;if(position>=start&&position<=end)return trimmed}offset+=statement.length+1}return first}
    async function run(){const button=$("run"),query=selectedSql()||statementAtCursor();button.disabled=true;if(!query){message("Enter or select a SQL statement before running.","error");button.disabled=false;return}message("Executing as your Databricks user...");try{const result=await api("/api/query",{method:"POST",body:JSON.stringify({database:state.db,query,limit:state.runMode==="all"?null:500})});state.lastResult=result;if(result.columns.length)$("result").innerHTML=renderTable(result.rows,result.columns);else message(result.command||"Statement completed.","success");$("meta").textContent=`${result.row_count} rows · ${result.elapsed_ms} ms${result.truncated?" · first 500 shown":""}`;panel("output");$("dirty").hidden=true}catch(e){message(e.message,"error")}finally{button.disabled=false}}
    function downloadResults(format){const result=state.lastResult;if(!result?.columns?.length){message("Run a query with results before downloading.","error");return}const delimiter=format==="tsv"?"\t":",",clean=value=>String(value??"").replace(/[\r\n]/g," ").replaceAll(delimiter," ").replaceAll('"',""),content=[result.columns.map(clean).join(delimiter),...result.rows.map(row=>result.columns.map(column=>clean(row[column])).join(delimiter))].join("\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob([content],{type:format==="tsv"?"text/tab-separated-values;charset=utf-8":"text/csv;charset=utf-8"}));link.download=`lakebase-results.${format}`;link.click();URL.revokeObjectURL(link.href)}
    async function boot(){try{const[who,data]=await Promise.all([api("/api/whoami"),api("/api/databases")]);$("user").textContent=who.username;$("host").textContent=location.hostname;$("database").innerHTML=data.databases.map(x=>`<option value="${escapeHtml(x.name)}">${escapeHtml(x.name)}</option>`).join("");if(!data.databases.length)throw Error("No databases are visible to this user.");state.db=data.databases.some(x=>x.name===data.default)?data.default:data.databases[0].name;$("database").value=state.db;await loadSchemas()}catch(e){$("host").textContent="Connection unavailable";$("user").textContent="Authorization required";tree.innerHTML=`<div class="empty">${escapeHtml(e.message)}<br><br>Check user authorization and Lakebase access.</div>`;message(e.message,"error")}}
    tree.addEventListener("click",e=>{const b=e.target.closest("button[data-action]");if(!b)return;if(b.dataset.action==="expand")expand(b.dataset.schema);if(b.dataset.action==="toggle-group")toggleGroup(b);if(b.dataset.action==="select")selectObject(b)});
    const objectMenu=$("object-menu");let menuTarget=null;
    tree.addEventListener("contextmenu",e=>{const button=e.target.closest('button[data-action="select"]');if(!button)return;e.preventDefault();menuTarget=button;objectMenu.querySelector('[data-menu-action="select-1000"]').hidden=!["table","partitioned table","foreign table","view","materialized view"].includes(button.dataset.kind);objectMenu.hidden=false;objectMenu.style.left=`${Math.max(8,Math.min(e.clientX,innerWidth-objectMenu.offsetWidth-8))}px`;objectMenu.style.top=`${Math.max(8,Math.min(e.clientY,innerHeight-objectMenu.offsetHeight-8))}px`});
    objectMenu.addEventListener("click",async e=>{const action=e.target.closest("[data-menu-action]")?.dataset.menuAction,button=menuTarget;if(!action||!button)return;objectMenu.hidden=true;menuTarget=null;if(action==="show")await selectObject(button);else if(action==="edit"){await selectObject(button);if(state.details){editor.readOnly=false;editor.parentElement.classList.remove("readonly");syncEditMode();editor.focus()}}else if(action==="select-1000"){const quote=value=>'"'+value.replace(/"/g,'""')+'"';state.selected=null;state.details=null;setEditor(`SELECT * FROM ${quote(button.dataset.schema)}.${quote(button.dataset.name)} LIMIT 1000;`,"select-1000.sql",false);panel("output");await run()}});
    document.addEventListener("click",e=>{if(!objectMenu.contains(e.target))objectMenu.hidden=true});document.addEventListener("keydown",e=>{if(e.key==="Escape")objectMenu.hidden=true});
    $("edit-mode").addEventListener("click",()=>{if(!state.selected||!state.details)return;editor.readOnly=!editor.readOnly;syncEditMode();if(!editor.readOnly)editor.focus()});
    $("database").addEventListener("change",()=>setEditor("","query.sql",false));
    const resultsResize=$("results-resize");let resizeStart=null;
    function setResultsHeight(height){const main=resultsResize.parentElement,toolbarHeight=window.matchMedia("(max-width: 760px)").matches?44:45,max=Math.max(145,Math.min(520,main.clientHeight-toolbarHeight-132)),next=Math.max(145,Math.min(max,height));main.style.gridTemplateRows=`${toolbarHeight}px minmax(120px, 1fr) 12px ${next}px`;resultsResize.setAttribute("aria-valuemax",String(max));resultsResize.setAttribute("aria-valuenow",String(Math.round(next)))}
    resultsResize.addEventListener("mousedown",e=>{if(e.button!==0)return;e.preventDefault();resizeStart={y:e.clientY,height:document.querySelector(".results").getBoundingClientRect().height};document.body.classList.add("resizing")});
    document.addEventListener("mousemove",e=>{if(!resizeStart)return;setResultsHeight(resizeStart.height+resizeStart.y-e.clientY)});
    function endResize(){resizeStart=null;document.body.classList.remove("resizing")}
    document.addEventListener("mouseup",endResize);window.addEventListener("blur",endResize);
    const sidebarResize=$("sidebar-resize"),layout=sidebarResize.parentElement;let sidebarStart=null;
    function setSidebarWidth(width){const max=Math.max(220,Math.min(480,layout.clientWidth-340)),next=Math.max(220,Math.min(max,width));layout.style.gridTemplateColumns=`${next}px 10px minmax(0,1fr)`;sidebarResize.setAttribute("aria-valuemax",String(max));sidebarResize.setAttribute("aria-valuenow",String(Math.round(next)))}
    sidebarResize.addEventListener("mousedown",e=>{if(e.button!==0)return;e.preventDefault();sidebarStart={x:e.clientX,width:$("explorer").getBoundingClientRect().width};document.body.classList.add("resizing-columns")});
    document.addEventListener("mousemove",e=>{if(sidebarStart)setSidebarWidth(sidebarStart.width+e.clientX-sidebarStart.x)});
    function endSidebarResize(){sidebarStart=null;document.body.classList.remove("resizing-columns")}
    document.addEventListener("mouseup",endSidebarResize);window.addEventListener("blur",endSidebarResize);
    sidebarResize.addEventListener("keydown",e=>{const width=$("explorer").getBoundingClientRect().width;if(e.key==="ArrowLeft")setSidebarWidth(width-20);else if(e.key==="ArrowRight")setSidebarWidth(width+20);else return;e.preventDefault()});
    resultsResize.addEventListener("keydown",e=>{const current=document.querySelector(".results").getBoundingClientRect().height,max=Math.max(145,Math.min(520,resultsResize.parentElement.clientHeight-185));let next=current;if(e.key==="ArrowUp")next+=24;else if(e.key==="ArrowDown")next-=24;else if(e.key==="Home")next=145;else if(e.key==="End")next=max;else return;e.preventDefault();setResultsHeight(next)});
    editor.addEventListener("input",()=>{$("dirty").hidden=false;const tab=currentEditor();if(tab){tab.value=editor.value;tab.dirty=true}renderEditorTabs();lines();showSuggestions()});editor.addEventListener("keydown",e=>{if(!completionState.items.length)return;if(e.key==="ArrowDown"){e.preventDefault();moveSuggestion(1)}else if(e.key==="ArrowUp"){e.preventDefault();moveSuggestion(-1)}else if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();chooseSuggestion()}else if(e.key==="Escape"){e.preventDefault();hideSuggestions()}});editor.addEventListener("blur",()=>setTimeout(hideSuggestions,120));suggestions.addEventListener("mousedown",e=>{const item=e.target.closest("[data-completion-index]");if(!item)return;e.preventDefault();chooseSuggestion(Number(item.dataset.completionIndex))});editor.addEventListener("scroll",()=>{$("gutter").scrollTop=editor.scrollTop;highlight.scrollTop=editor.scrollTop;highlight.scrollLeft=editor.scrollLeft});editor.addEventListener("keydown",e=>{if(e.defaultPrevented)return;if(e.key==="Tab"){e.preventDefault();document.execCommand("insertText",false,"  ")}if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();run()}});
    editor.addEventListener("select",()=>setRunMode(state.runMode));editor.addEventListener("keyup",()=>setRunMode(state.runMode));
    const runControl=$("run-control"),runToggle=$("run-toggle"),runMenu=$("run-menu");function setRunMode(mode){state.runMode=mode;$("run-label").textContent=mode==="limit"?"Run (500)":"Run";runMenu.querySelectorAll("[data-run-mode]").forEach(item=>item.querySelector(".check").textContent=item.dataset.runMode===mode?"✓":"")};setRunMode(state.runMode);runToggle.addEventListener("click",e=>{e.stopPropagation();runMenu.hidden=!runMenu.hidden;runControl.classList.toggle("open",!runMenu.hidden);runToggle.setAttribute("aria-expanded",String(!runMenu.hidden))});runMenu.addEventListener("click",e=>{const item=e.target.closest("button");if(!item)return;if(item.dataset.runMode)setRunMode(item.dataset.runMode);runMenu.hidden=true;runControl.classList.remove("open");runToggle.setAttribute("aria-expanded","false")});
    const downloadToggle=$("result-download-toggle"),downloadMenu=$("download-menu");downloadToggle.addEventListener("click",e=>{e.stopPropagation();downloadMenu.hidden=!downloadMenu.hidden;downloadToggle.setAttribute("aria-expanded",String(!downloadMenu.hidden))});downloadMenu.addEventListener("click",e=>{const item=e.target.closest("[data-download-format]");if(!item)return;downloadResults(item.dataset.downloadFormat);downloadMenu.hidden=true;downloadToggle.setAttribute("aria-expanded","false")});
    $("run").addEventListener("click",run);$("refresh").addEventListener("click",loadSchemas);$("database").addEventListener("change",e=>{state.db=e.target.value;state.schema="";state.selected=null;state.details=null;$("breadcrumb").textContent=`${state.db} / DATABASE EXPLORER`.toUpperCase();loadSchemas()});$("system").addEventListener("change",loadSchemas);
    $("filter").addEventListener("input",loadSchemas);
    editorTabs.addEventListener("click",e=>{const close=e.target.closest("[data-tab-close]");if(close){closeEditor(Number(close.dataset.tabClose));return}const tab=e.target.closest("[data-tab-select]");if(tab)activateEditor(Number(tab.dataset.tabSelect))});
    const settingsButton=$("settings-button"),settingsPanel=$("settings-panel"),moreActions=$("more-actions"),moreMenu=$("more-menu");applyPreferences();settingsButton.addEventListener("click",e=>{e.stopPropagation();settingsPanel.hidden=!settingsPanel.hidden;settingsButton.setAttribute("aria-expanded",String(!settingsPanel.hidden))});settingsPanel.addEventListener("click",e=>e.stopPropagation());moreActions.addEventListener("click",e=>{e.stopPropagation();moreMenu.hidden=!moreMenu.hidden;moreActions.setAttribute("aria-expanded",String(!moreMenu.hidden))});moreMenu.addEventListener("click",e=>{const action=e.target.closest("[data-more-action]")?.dataset.moreAction;if(!action)return;moreMenu.hidden=true;moreActions.setAttribute("aria-expanded","false");if(action==="new")createEditor();else if(action==="format")formatSql()});$("theme").addEventListener("change",e=>{preferences.theme=e.target.value;localStorage.setItem("lakebase-theme",preferences.theme);applyPreferences()});$("font-size").addEventListener("change",e=>{preferences.fontSize=e.target.value;localStorage.setItem("lakebase-font-size",preferences.fontSize);applyPreferences()});document.addEventListener("click",()=>{settingsPanel.hidden=true;settingsButton.setAttribute("aria-expanded","false");runMenu.hidden=true;runControl.classList.remove("open");runToggle.setAttribute("aria-expanded","false");downloadMenu.hidden=true;downloadToggle.setAttribute("aria-expanded","false");moreMenu.hidden=true;moreActions.setAttribute("aria-expanded","false")});
    document.querySelectorAll(".result-tab").forEach(x=>x.addEventListener("click",()=>panel(x.dataset.panel,true)));
    renderEditorTabs();
    document.querySelectorAll(".result-tab").forEach(x=>x.addEventListener("click",()=>panel(x.dataset.panel)));$("mobile-menu").addEventListener("click",()=>$("explorer").classList.toggle("open"));boot();
  </script>
